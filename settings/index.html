<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    :root {
      --bg: transparent; --card: #f4f5f7; --text: #1b1f24; --muted: #6a7480;
      --line: #dfe3e8; --ok: #1e9e57; --off: #8a94a0; --bad: #d64545; --accent: #0a6ebd;
    }
    @media (prefers-color-scheme: dark) {
      :root { --card: #23272d; --text: #eceff3; --muted: #9aa5b1; --line: #343a42; --accent: #4da3ee; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: .85rem; margin-bottom: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .85rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .card h2 { font-size: 1rem; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); flex: none; }
    .dot.off { background: var(--off); } .dot.bad { background: var(--bad); }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-top: 1px solid var(--line); font-size: .9rem; }
    .row:first-of-type { border-top: 0; }
    .row .k { color: var(--muted); } .row .v { text-align: end; font-weight: 600; }
    .note { color: var(--muted); font-size: .75rem; font-weight: 400; display: block; }
    .empty, .err { padding: 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
    .err { border-color: var(--bad); }
    button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  </style>
</head>

  <h1 id="title"></h1>
  <div class="sub"><span id="updated"></span> <button id="refresh"></button></div>
  <div class="chips" id="chips"></div>

let T = TEXT.en;
let lastLoaded = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

function temp(v) { return typeof v === 'number' ? `${v.toFixed(1)} °C` : T.unknown; }

function agoText(n, u) { return T.agoFmt.replace('{n}', n).replace('{u}', u); }

function ago(ts) {
  if (!ts) return T.unknown;
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 90) return agoText(s, T.s);
  const m = Math.round(s / 60);
  if (m < 90) return agoText(m, T.m);
  return agoText(Math.round(m / 60), T.h);
}

function row(card, key, value, note) {
  const r = el('div', 'row');
  r.appendChild(el('span', 'k', key));
  const v = el('span', 'v', value);
  if (note) v.appendChild(el('span', 'note', note));
  r.appendChild(v);
  card.appendChild(r);
}

function render(devices) {
  document.getElementById('title').textContent = T.title;
  const online = devices.filter((d) => d.available).length;
  const on = devices.filter((d) => d.available && d.onoff).length;

  const chips = document.getElementById('chips');
  chips.textContent = '';
  [`${devices.length} ${T.devices}`, `${online} ${T.online}`, `${on} ${T.on}`, `${devices.length - online} ${T.offline}`]
    .forEach((t) => chips.appendChild(el('span', 'chip', t)));

  const content = document.getElementById('content');
  content.textContent = '';
  if (!devices.length) { content.appendChild(el('div', 'empty', T.none)); return; }

  const grid = el('div', 'grid');
  devices.forEach((d) => {
    const card = el('div', 'card');
    const h = el('h2');
    h.appendChild(el('span', `dot ${d.available ? (d.onoff ? '' : 'off') : 'bad'}`));
    h.appendChild(el('span', null, d.name));
    card.appendChild(h);

    row(card, T.power, d.onoff ? T.powerOn : T.powerOff);
    row(card, T.mode, T.modes[d.mode] || T.unknown);
    row(card, T.cooling, temp(d.targetCooling));
    row(card, T.heating, temp(d.targetHeating));
    row(card, T.temp, temp(d.temperature));
    row(card, T.fan, T.fans[d.fanSpeed] || T.unknown, d.fanSpeed === '1' || d.fanSpeed === '2' ? T.fanNote : null);
    row(card, T.louver, T.louvers[d.louver] || T.unknown, d.louver ? T.louverNote : null);
    row(card, T.onMode, T.onModes[d.onMode] || T.unknown);
    row(card, T.lastMode, T.modes[d.lastActiveMode] || T.unknown);
    if (d.group) {
      row(card, T.group, d.group);
      row(card, T.role, T.roles[d.role] || T.unknown);
    }
    row(card, T.seen, ago(d.lastSeen));
    row(card, T.ieee, d.ieee || T.unknown);
    grid.appendChild(card);
  });
  content.appendChild(grid);
}

function onHomeyReady(Homey) {
  let lang = 'en';
  try { lang = String((Homey.getLanguage && Homey.getLanguage()) || navigator.language || 'en').slice(0, 2); } catch (e) { /* keep en */ }
  if (lang === 'nb' || lang === 'nn') lang = 'no';
  T = Object.assign({}, TEXT.en, TEXT[lang] || {});
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = TEXT[lang] ? lang : 'en';
  const btn = document.getElementById('refresh');
  btn.textContent = T.refresh;

  function load() {
    Homey.api('GET', '/status', null, (err, devices) => {
      if (err) {
        const content = document.getElementById('content');
        content.textContent = '';
        content.appendChild(el('div', 'err', `${T.error}: ${err.message || err}`));
        return;
      }
      lastLoaded = new Date();
      document.getElementById('updated').textContent = `${T.updated}: ${lastLoaded.toLocaleTimeString()}`;
      render(devices || []);
    });
  }

  btn.addEventListener('click', load);
  document.getElementById('title').textContent = T.title;
  document.getElementById('updated').textContent = `${T.updated}: ${T.never}`;
  load();
  setInterval(load, 10000);
  Homey.ready();
}
</script>
